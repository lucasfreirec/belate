# Prometheus scrapes the API's /metrics, which also reports what the collector is doing.
# Used by the full Compose stack and by Kubernetes, where the API is the service `api`.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: belate-api
    static_configs:
      - targets: ["api:8000"]
