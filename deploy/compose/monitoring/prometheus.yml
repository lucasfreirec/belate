# Prometheus scrapes the API's /metrics, which also reports what the collector is doing.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: belate-api
    static_configs:
      # The API as run by `make api` on the host. In the cluster this becomes the service.
      - targets: ["host.docker.internal:8000"]
