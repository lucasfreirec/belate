# The whole system in containers: the collector (docker-compose.collector.yml, loaded first)
# plus the API, the frontend, Prometheus and Grafana. Start it with `make stack-up` from the
# repository root, then open http://localhost:8080.
#
# Only the frontend, Prometheus and Grafana are published, and only on this machine. The API
# is reached through the frontend under /api, as it will be in production.
name: belate

x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://belate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/belate
  REDIS_URL: redis://redis:6379/0
  API_TOKEN: ${API_TOKEN:-}
  # Only the web container (and Prometheus) can reach the API, so the X-Forwarded-For
  # header the web container sets is trusted. The API rate-limits on that address.
  FORWARDED_ALLOW_IPS: "*"

services:
  api:
    image: belate-app:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: belate-web:local
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/belate.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
