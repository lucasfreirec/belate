# Only the web pods are published. Prometheus, Grafana and the API stay inside the cluster;
# the API is reached through the web pods under /api, which block /api/metrics.
#
# The host name below is a placeholder: deploy/k8s/render-release.sh replaces it with the
# real one. cert-manager obtains and renews the HTTPS certificate from Let's Encrypt
# (deploy/server/cluster-issuer.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app.kubernetes.io/component: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Send plain HTTP visitors to HTTPS.
    traefik.ingress.kubernetes.io/router.middlewares: belate-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - belate.example.com
      secretName: web-tls
  rules:
    - host: belate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
